name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compilar
        run: mvn -B -ntp compile

      - name: Ejecutar tests (JUnit 5)
        run: mvn -B -ntp test

      - name: Empaquetar JAR
        run: mvn -B -ntp -DskipTests package

      - name: Subir informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-report-java-${{ matrix.java }}
          path: target/surefire-reports/
          retention-days: 7
